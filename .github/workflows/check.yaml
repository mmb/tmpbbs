---
# yamllint disable rule:line-length
name: Check
'on':
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: 6 6 * * 6

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker://rhysd/actionlint@sha256:6f03470d0152251d7f07f7c4dc019dbe7024c72cd952f839544c7798843efa8f
        with:
          args: -color
  committed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: crate-ci/committed@v1.1.12
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
      - name: Run ESLint
        run: npm install eslint @eslint/js globals && npx eslint
  go-generate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Install the latest protoc and update tools
        run: |
          PROTOC_VERSION=$(gh api repos/protocolbuffers/protobuf/releases/latest --jq '.tag_name[1:]')
          curl --location --remote-name "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          unzip -d "$HOME/.local" "protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          chmod +x "$HOME/.local/bin/protoc"
          go get -modfile=tools/go.mod -u tool
      - name: Check that go generated code is up to date
        run: |
          go generate ./...
          git diff --exit-code
  golangci-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir:
          - .
          - tests/integration
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: ${{ matrix.dir }}/go.mod
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          working-directory: ${{ matrix.dir }}
          args: --config=${{ github.workspace }}/.golangci.yaml
  govulncheck:
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - uses: golang/govulncheck-action@v1.1.0
        with:
          go-version-file: go.mod
          go-version-input:
          output-format: sarif
          output-file: ${{ github.ref == 'refs/heads/main' && 'govulncheck.sarif' || '' }}
      - uses: github/codeql-action/upload-sarif@v4.39.3
        if: github.ref == 'refs/heads/main' && (success() || failure())
        with:
          sarif_file: govulncheck.sarif
  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: hadolint/hadolint-action@v3.5.0
  htmlhint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Run HTMLhint
        run: |
          npm install --global htmlhint
          go run tmpbbs.go &
          curl --fail --retry 30 --retry-connrefused --retry-delay 1 --silent http://localhost:8080/healthz
          htmlhint http://localhost:8080/
  integration-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: tests/integration
    steps:
      - id: kind
        uses: helm/kind-action@v1.15.2
        with:
          registry: true
      - uses: docker/setup-buildx-action@v4.4.1
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."kind-registry:5000"]
            http = true
      - uses: actions/checkout@v7.0.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          tags: ${{ steps.kind.outputs.LOCAL_REGISTRY }}/tmpbbs:test
          build-args: |
            VERSION=test
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Run integration tests
        run: go tool ginkgo --fail-on-pending --github-output -p -r --randomize-all
  kubeconform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Kustomize
        run: kubectl kustomize kubernetes > kustomized.yaml
      - uses: docker://ghcr.io/yannh/kubeconform@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c
        with:
          args: -strict -summary kustomized.yaml
  markdownlint-cli2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@v25.0.0
        with:
          globs: '**/*.md'
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Run ShellCheck
        run: find . -type f -name "*.sh" -exec shellcheck --format gcc {} +
  stylelint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
      - name: Run Stylelint
        run: npm install stylelint stylelint-config-standard && npx stylelint --formatter unix '**/*.css'
  trivy:
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          exit-code: '1'
          scan-type: fs
          format: sarif
          output: ${{ github.ref == 'refs/heads/main' && 'trivy.sarif' || '' }}
      - uses: github/codeql-action/upload-sarif@v4.39.3
        if: github.ref == 'refs/heads/main' && (success() || failure())
        with:
          sarif_file: trivy.sarif
  typos:
    runs-on: ubuntu-latest
    env:
      CLICOLOR: 1
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: crate-ci/typos@v1.52.1
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Run yamllint
        run: yamllint --format github .
  zap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Start tmpbbs
        run: |
          go run tmpbbs.go &
          curl --fail --retry 30 --retry-connrefused --retry-delay 1 --silent http://localhost:8080/healthz
      - uses: zaproxy/action-full-scan@v0.13.0
        with:
          target: http://localhost:8080
          rules_file_name: .zap/rules.tsv
          cmd_options: -a
          allow_issue_writing: false
          fail_action: true
