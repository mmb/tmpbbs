---
version: '2'
linters:
  default: all
  disable:
    - depguard
    - exhaustruct
    - exhaustruct_v5
    - gomodguard
    - wrapcheck
    - wsl
  settings:
    decorder:
      disable-dec-order-check: false
    errcheck:
      disable-default-exclusions: true
      check-blank: true
      check-type-assertions: true
    errchkjson:
      check-error-free-encoding: true
    fatcontext:
      check-struct-pointers: true
    funcorder:
      alphabetical: true
      function: true
    gocritic:
      enable-all: true
      disabled-checks:
        - paramTypeCombine
        - unnamedResult
    godoclint:
      default: all
    godot:
      capital: true
    gomoddirectives:
      replace-allow-list:
        - github.com/kyokomi/emoji/v2
    govet:
      enable-all: true
      settings:
        shadow:
          strict: true
    iface:
      enable:
        - identical
        - unused
        - opaque
        - unexported
    nilnil:
      detect-opposite: true
    nolintlint:
      require-explanation: true
      require-specific: true
    nonamedreturns:
      report-error-in-defer: true
  exclusions:
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      - path: tests/integration
        linters:
          - fatcontext
          - gochecknoglobals
          - godoclint
          - gosec
          - gosmopolitan
          - paralleltest
      - path: tests/integration
        linters:
          - revive
        text: dot-imports
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
